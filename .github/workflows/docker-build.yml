name: Build and Push to Aliyun

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ "main" ]

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      new_version: ${{ steps.check.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4

      # ✅ 更稳
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check version
        id: check
        run: |
          latest=$(npm show musicn version)
          current=$(cat .last_upstream_tag)

          echo "Latest: $latest"
          echo "Current: $current"

          if [ "$latest" != "$current" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "new_version=$latest" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ buildx（推荐）
      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.IMAGE_NAME }}:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.IMAGE_NAME }}:${{ needs.check-version.outputs.new_version }}

      - name: Update version file
        run: |
          echo "${{ needs.check-version.outputs.new_version }}" > .last_upstream_tag

      - name: Commit version update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .last_upstream_tag
          git commit -m "update version [skip ci]" || echo "no changes"
          git push origin HEAD:main
